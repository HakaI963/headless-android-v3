# Tags a release and attaches the APK the build script produces.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the APK to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK
        run: |
          mkdir -p "$HOME/android-sdk" "$GITHUB_WORKSPACE/sdk"
          curl -fsSL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip -d "$HOME/android-sdk/tmp"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/tmp/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$HOME/android-sdk" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$HOME/android-sdk" \
            "platforms;android-36" "build-tools;35.0.0"

      - name: Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sdk/platforms" "$GITHUB_WORKSPACE/sdk/build-tools"
          ln -s "$HOME/android-sdk/platforms/android-36" \
            "$GITHUB_WORKSPACE/sdk/platforms/android-36"
          ln -s "$HOME/android-sdk/build-tools/35.0.0" \
            "$GITHUB_WORKSPACE/sdk/build-tools/35.0.0"
          ANDROID_HOME="$GITHUB_WORKSPACE/sdk" JAVA_HOME="$JAVA_HOME" \
            ./scripts/build-apk.sh
          cp build/local/headless-droid-debug.apk \
            "headless-droid-${{ steps.tag.outputs.tag }}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "headless-droid-$TAG.apk" \
            --title "Headless Droid $TAG" \
            --notes "Debug-signed APK built by scripts/build-apk.sh. Shizuku is required at runtime."